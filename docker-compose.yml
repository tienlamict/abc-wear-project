services:
  mysql:
    image: mysql:8.4
    container_name: abcwear-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: selling
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit
    container_name: abcwear-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Product images (spec §9.5). The official minio/minio image is no longer published on
  # Docker Hub, so this uses Bitnami's build of the same MinIO server (pinned tag, see
  # DECISIONS.md). Only the mock Main System holds the keys; the website reads public URLs.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: abcwear-minio
    restart: unless-stopped
    entrypoint: ["minio"]
    command: ["server", "/bitnami/minio/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: creates the bucket and makes it publicly readable (download only, no writes).
  minio-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: abcwear-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-12345}
      MINIO_BUCKET: ${MINIO_BUCKET:-product-images}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export MC_CONFIG_DIR=/tmp/.mc &&
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        mc anonymous set download "local/$$MINIO_BUCKET"

volumes:
  mysql-data:
  minio-data:
